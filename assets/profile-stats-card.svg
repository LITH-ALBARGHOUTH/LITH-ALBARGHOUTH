    <text x="68" y="50" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Major Projects</text>
  </g>
  <g transform="translate(192 88)">
    <rect width="136" height="70" rx="12" fill="#111827" stroke="#243041"/>
    <text x="68" y="28" text-anchor="middle" fill="#A78BFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">5</text>
    <text x="68" y="50" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">AI Focus Areas</text>
  </g>
  <g transform="translate(356 88)">
    <rect width="136" height="70" rx="12" fill="#111827" stroke="#243041"/>
    <text x="68" y="28" text-anchor="middle" fill="#FF7AA8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">4</text>
    <text x="68" y="50" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Product Tracks</text>
