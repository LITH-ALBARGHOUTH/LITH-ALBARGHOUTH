<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-label="Profile stats card">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF3D81"/>
    </linearGradient>
  </defs>
  <rect width="520" height="190" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="518" height="188" rx="13" fill="none" stroke="#30363D"/>
  <text x="28" y="38" fill="#00D9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Profile Snapshot</text>
  <text x="28" y="65" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">AI, computer vision, NLP, full-stack, mobile, and embedded systems.</text>

  <g transform="translate(28 88)">
