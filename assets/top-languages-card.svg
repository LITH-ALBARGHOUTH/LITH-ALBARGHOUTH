<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="Top languages and stack mix card">
  <rect width="520" height="230" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="518" height="228" rx="13" fill="none" stroke="#30363D"/>

  <text x="28" y="38" fill="#00D9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Top Languages &amp; Stack Mix</text>
  <text x="28" y="64" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Based on public projects and resume stack.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(28 88)">
      <text x="0" y="0" fill="#CBD5E1" font-size="13" font-weight="700">Python</text>
      <text x="444" y="0" text-anchor="end" fill="#94A3B8" font-size="12" font-weight="700">AI / CV / NLP / APIs</text>
      <rect x="0" y="10" width="444" height="10" rx="5" fill="#111827"/>
      <rect x="0" y="10" width="320" height="10" rx="5" fill="#3572A5"/>
    </g>

    <g transform="translate(28 122)">
      <text x="0" y="0" fill="#CBD5E1" font-size="13" font-weight="700">TypeScript &amp; JavaScript</text>
      <text x="444" y="0" text-anchor="end" fill="#94A3B8" font-size="12" font-weight="700">Web / Extensions / Backend</text>
      <rect x="0" y="10" width="444" height="10" rx="5" fill="#111827"/>
      <rect x="0" y="10" width="260" height="10" rx="5" fill="#F1E05A"/>
    </g>

    <g transform="translate(28 156)">
      <text x="0" y="0" fill="#CBD5E1" font-size="13" font-weight="700">C# &amp; Unity</text>
      <text x="444" y="0" text-anchor="end" fill="#94A3B8" font-size="12" font-weight="700">Game Systems</text>
      <rect x="0" y="10" width="444" height="10" rx="5" fill="#111827"/>
      <rect x="0" y="10" width="150" height="10" rx="5" fill="#178600"/>
    </g>

    <g transform="translate(28 190)">
      <text x="0" y="0" fill="#CBD5E1" font-size="13" font-weight="700">Dart / C++ / Embedded</text>
      <text x="444" y="0" text-anchor="end" fill="#94A3B8" font-size="12" font-weight="700">Mobile / Hardware</text>
      <rect x="0" y="10" width="444" height="10" rx="5" fill="#111827"/>
      <rect x="0" y="10" width="190" height="10" rx="5" fill="#00B4AB"/>
    </g>
  </g>
</svg>
